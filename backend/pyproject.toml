[project]
name = "backend"
version = "0.1.0"
description = "Finance RAG backend: FastAPI + LangChain + Qdrant with Self-RAG"
readme = "README.md"
authors = [
    { name = "kashaf khan", email = "mdkashaf9931@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "langchain>=1.4.3",
    "langchain-core>=1.6.5",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "pdf2image>=1.17.0",
    "pillow>=11.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
finance-rag = "app.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
